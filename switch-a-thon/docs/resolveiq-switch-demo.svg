<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResolveIQ and Switch incident investigation demo flow</title>
  <desc id="desc">An engineer reports a failed shipment in Mattermost. Switch connects the room to the Codex ResolveIQ investigator, which uses read-only tools to inspect services, PostgreSQL, Redis, Prometheus, and Loki, then replies with evidence and a recommendation. Prometheus alerts can also reach Mattermost through Alertmanager.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#54708e"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#08a88a"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#ee9251"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16324f" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}
      .title{font-size:34px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:17px;fill:#58718b}
      .eyebrow{font-size:13px;font-weight:750;letter-spacing:1.5px;fill:#71869b}
      .head{font-size:20px;font-weight:700}.body{font-size:15px;fill:#526b83}.small{font-size:13px;fill:#617991}
      .box{fill:#fff;stroke:#dce6ef;stroke-width:1.5}.panel{fill:#f6f9fc;stroke:#e3ebf2;stroke-width:1.4}
      .line{fill:none;stroke:#54708e;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#f4f7fb"/>
  <text x="72" y="76" class="eyebrow">RESOLVEIQ · LIVE DEMO</text>
  <text x="72" y="125" class="title">From “label failed” to an evidence-based answer</text>
  <text x="72" y="158" class="subtitle">A teammate asks in Mattermost. Switch connects the Codex investigator to the conversation and to ResolveIQ’s read-only evidence.</text>

  <!-- Main participant cards -->
  <g filter="url(#shadow)">
    <rect x="65" y="245" width="310" height="290" rx="22" class="box"/>
    <rect x="1215" y="245" width="320" height="290" rx="22" class="box"/>
  </g>
  <text x="96" y="286" class="eyebrow">TEAM CHAT</text>
  <circle cx="119" cy="333" r="18" fill="#e8f0ff"/><text x="119" y="339" text-anchor="middle" font-size="17" font-weight="700" fill="#3765c9">M</text>
  <text x="151" y="339" class="head">Mattermost room</text>
  <rect x="95" y="369" width="250" height="93" rx="14" fill="#f5f8fc" stroke="#e4ebf2"/>
  <text x="114" y="399" class="body">“Why did this label fail?</text>
  <text x="114" y="423" class="body">Investigate ZONE_NOT_FOUND</text>
  <text x="114" y="447" class="body">for the last 5 minutes.”</text>
  <text x="96" y="500" class="small">The investigator replies in this same room.</text>

  <!-- Switch toggle centerpiece -->
  <text x="800" y="245" text-anchor="middle" class="eyebrow">THE CONNECTION</text>
  <g filter="url(#shadow)">
    <rect x="440" y="277" width="720" height="232" rx="28" fill="#102c4a"/>
  </g>
  <text x="800" y="324" text-anchor="middle" font-size="15" font-weight="750" letter-spacing="2" fill="#a9c0d6">SWITCH</text>
  <rect x="706" y="344" width="188" height="74" rx="37" fill="#087f70" stroke="#4de0bd" stroke-width="2"/>
  <text x="741" y="390" font-size="16" font-weight="800" letter-spacing="1.1" fill="#c9fff0">ON</text>
  <circle cx="853" cy="381" r="28" fill="#fff"/>
  <path d="M843 381l7 7 14-16" fill="none" stroke="#087f70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="454" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Connected to your Codex investigator</text>
  <text x="800" y="480" text-anchor="middle" font-size="14" fill="#bad0e2">messages in · investigation out · human stays in control</text>

  <!-- Agent card -->
  <g filter="url(#shadow)"><rect x="590" y="568" width="420" height="184" rx="22" class="box"/></g>
  <rect x="619" y="596" width="42" height="42" rx="13" fill="#e8f6f3"/>
  <path d="M630 617h20M640 607v20" stroke="#078a77" stroke-width="3" stroke-linecap="round"/>
  <text x="675" y="615" class="head">Codex · ResolveIQ investigator</text>
  <text x="620" y="660" class="body">Uses read-only MCP tools to gather evidence:</text>
  <text x="620" y="687" class="small">error counts · service lookups · logs · DB/cache snapshots</text>
  <text x="620" y="718" class="small">Responds with likely cause, evidence, and next steps.</text>

  <!-- ResolveIQ stack card -->
  <text x="1247" y="286" class="eyebrow">YOUR LOCAL DEMO STACK</text>
  <rect x="1247" y="310" width="256" height="71" rx="14" fill="#eaf1ff" stroke="#d8e4fb"/>
  <text x="1266" y="339" font-size="16" font-weight="700" fill="#315caa">Label Service</text>
  <text x="1266" y="362" class="small">POST /labels · 5082</text>
  <path d="M1375 383v14" class="line"/>
  <rect x="1247" y="403" width="256" height="71" rx="14" fill="#eaf8f5" stroke="#d4eee7"/>
  <text x="1266" y="432" font-size="16" font-weight="700" fill="#087f70">Configuration Service</text>
  <text x="1266" y="455" class="small">GET /zones · GET /rates · 5081</text>
  <text x="1248" y="508" class="small">PostgreSQL + Redis · Prometheus + Loki</text>

  <!-- Arrows from chat through Switch and tools to evidence -->
  <path d="M375 360H425" class="line"/>
  <path d="M440 445H385" class="line"/>
  <path d="M800 509V548" fill="none" stroke="#08a88a" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M1010 670H1100V520H1215" fill="none" stroke="#08a88a" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M1215 546H1155V724H1010" fill="none" stroke="#54708e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1080" y="650" text-anchor="end" class="small">read-only MCP query</text>
  <text x="1168" y="706" text-anchor="end" class="small">metrics · logs · lookups</text>

  <!-- Observability and alert pathway -->
  <rect x="65" y="797" width="1470" height="58" rx="15" fill="#fff8f1" stroke="#f2dfca"/>
  <circle cx="98" cy="826" r="9" fill="#ee9251"/>
  <text x="120" y="832" font-size="14" font-weight="750" fill="#9a582b">OPTIONAL ALERT PATH</text>
  <text x="310" y="832" class="body">Prometheus alert</text>
  <path d="M453 826H520" fill="none" stroke="#ee9251" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="541" y="832" class="body">Alertmanager</text>
  <path d="M658 826H725" fill="none" stroke="#ee9251" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="746" y="832" class="body">Mattermost incident room</text>
  <text x="990" y="832" class="small">The agent can then investigate the alert in context.</text>
</svg>
